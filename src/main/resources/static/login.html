<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>身份认证 - 自律星球</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.prod.js"></script>
</head>
<body class="auth-body">
<div id="app" v-cloak style="display:flex;flex-direction:column;align-items:center">
    <div class="boot-lines">{{ bootText }}</div>

    <div class="auth-card">
        <h1 class="auth-title">自律星球</h1>
        <p class="auth-sub">SELF-DISCIPLINE SYSTEM — AUTHENTICATION</p>

        <div class="auth-tabs">
            <button style="flex:1" :class="{'active-preset': mode==='login'}" @click="mode='login'">登入</button>
            <button style="flex:1" :class="{'active-preset': mode==='register'}" @click="mode='register'">注册单元</button>
        </div>

        <form @submit.prevent="submit">
            <input v-model.trim="form.username" placeholder="识别代号（用户名，至少 3 位）" required>
            <input v-model="form.password" type="password" placeholder="认证密钥（密码，至少 6 位）" required>
            <input v-if="mode==='register'" v-model.trim="form.nickname" placeholder="单元名称（昵称，可选）">
            <p class="auth-error" v-if="error">{{ error }}</p>
            <button class="btn-primary" type="submit" :disabled="loading">
                {{ loading ? '认证中…' : (mode === 'login' ? '接入系统' : '注册并接入') }}
            </button>
        </form>
    </div>
</div>

<script>
const { createApp } = Vue;
const BOOT_LINES = [
    'LOADING - SELF DISCIPLINE SYSTEM',
    'MEMORY CHECK .......... OK',
    'HABIT PROTOCOL ........ OK',
    'QUEST MODULE .......... OK',
    'ALL SYSTEMS GREEN'
];
createApp({
    data() {
        return {
            mode: 'login',
            form: { username: '', password: '', nickname: '' },
            error: '',
            loading: false,
            bootText: ''
        };
    },
    mounted() {
        // 开机自检逐行打印
        let line = 0, chars = 0;
        const timer = setInterval(() => {
            if (line >= BOOT_LINES.length) { clearInterval(timer); return; }
            chars += 3;
            const done = BOOT_LINES.slice(0, line).join('\n');
            const cur = BOOT_LINES[line].slice(0, chars);
            this.bootText = done + (done ? '\n' : '') + cur;
            if (chars >= BOOT_LINES[line].length) { line++; chars = 0; }
        }, 24);
    },
    methods: {
        async submit() {
            this.error = '';
            this.loading = true;
            try {
                const res = await fetch('/api/auth/' + this.mode, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(this.form)
                });
                const data = await res.json();
                if (!res.ok) {
                    this.error = data.message || '认证失败';
                    return;
                }
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                location.href = '/index.html';
            } catch (e) {
                this.error = '通讯中断，请确认系统已启动';
            } finally {
                this.loading = false;
            }
        }
    }
}).mount('#app');
</script>
</body>
</html>
